name: Cron — Friday review email

on:
  # 13:00 UTC every Friday = 15:00 SAST
  schedule:
    - cron: '0 13 * * 5'
  # Manual trigger for acceptance testing
  workflow_dispatch:

jobs:
  run:
    name: POST /api/cron/friday-review-email
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -s -o /tmp/body.txt -w '%{http_code}' \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            https://solochief.app/api/cron/friday-review-email)

          body=$(cat /tmp/body.txt)
          echo "HTTP status : ${response}"
          echo "Response    : ${body}"

          if [ "${response}" != "200" ]; then
            echo "ERROR: expected 200, got ${response}"
            exit 1
          fi
