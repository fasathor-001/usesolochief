<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoloChief — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0F1B2D;
      color: #F9FAFB;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 380px; }
    .mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(0,194,168,0.12);
      border: 1.5px solid rgba(0,194,168,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
      font-weight: 700;
      color: #00C2A8;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 8px; }
    p  { font-size: 14px; color: rgba(249,250,251,0.55); line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #00C2A8;
      color: #0F1B2D;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="mark">S</div>
    <h1>You are offline</h1>
    <p>SoloChief needs a connection to load your dashboard. Check your network and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
